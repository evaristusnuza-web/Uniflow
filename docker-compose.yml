services:
  db:
    image: postgres:16
    container_name: academy_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: academy
    ports:
      - "5432:5432"
    volumes:
      - academy_pg_data:/var/lib/postgresql/data

volumes:
  academy_pg_data:
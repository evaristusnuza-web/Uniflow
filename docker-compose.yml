services:
  db:
    image: postgres:16
    container_name: academy_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: academy
    ports:
      - "5432:5432"
    volumes:
      - academy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d academy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  academy_pg_data:

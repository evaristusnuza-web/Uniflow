<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>Create account · UniFlow</title>
  <link rel="stylesheet" href="../shared/layout.css">
  <link rel="stylesheet" href="register.css">
  <script type="module" src="register.js"></script>
</head>
<body class="auth-page">
  <main class="wrap">
    <a class="button back-link" href="../login/login.html">← Back to sign in</a>
    <section class="cardAuth" aria-labelledby="page-title">
      <div class="top">
        <span class="eyebrow">START YOUR NEXT CHAPTER</span>
        <h1 id="page-title">Create your UniFlow account</h1>
        <p>Build a study plan, track your progress, and keep your learning in one place.</p>
      </div>
      <form id="registerForm" novalidate>
        <div class="mid">
          <div class="input">
            <label for="full_name">Full name</label>
            <input id="full_name" name="username" type="text" class="name" placeholder="Your name" autocomplete="name" minlength="2" maxlength="60" required>
          </div>
          <div class="input">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" class="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="input">
            <label for="major">Area of study <span class="optional">Optional</span></label>
            <input id="major" name="major" type="text" class="name" placeholder="e.g. Computer science" maxlength="100">
          </div>
          <div class="input">
            <label for="pw">Password</label>
            <div class="password-field">
              <input id="pw" name="password" type="password" class="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" maxlength="128" required>
              <button id="pwToggle" type="button" class="toggle-pass" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
          </div>
        </div>
        <div class="down">
          <button class="btn1" type="submit">Create account</button>
          <p class="error" id="msg" aria-live="polite" role="status"></p>
          <p class="auth-switch">Already have an account? <a href="../login/login.html">Sign in</a></p>
        </div>
      </form>
    </section>
  </main>
</body>
</html>

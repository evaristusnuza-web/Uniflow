<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account</title>
  <link rel="stylesheet" href="../shared/layout.css">
  <link rel="stylesheet" href="register.css">
  <script defer type="module" src="register.js"></script>
</head>

<body>
  <div class="wrap">
    <div class="buttonWrap">
      <button class="button"><a href="../login/login.html" class="bck">&lt; Back</a></button>
    </div>

    <div class="cardAuth">
      <div class="top">
        <h1>skyline hub</h1>
        <h2>welcome back!</h2>
      </div>

      <form id="registerForm">
        <div class="mid">
          <div class="input">
            <label for="full_name">Name</label>
            <input id="full_name" type="text" class="name" placeholder="john Doe" required>
          </div>

          <div class="input">
            <label for="email">Email</label>
            <input id="email" type="email" class="email" placeholder="you@example.com" required>
          </div>

        <div class="input">
            <label for="pw" class="l1">Password</label>

            <div class="password-field">
              <input id="pw" type="password" class="password" placeholder="password" required />
              <button id="pwToggle" type="button" class="toggle-pass" aria-label="Show password">👁</button>
            </div>
          </div>
          <script>
            const pw = document.getElementById("pw");
            const btn = document.getElementById("pwToggle");

            btn.addEventListener("click"
              , () => {
                pw.type = pw.type === "password" ? "text" : "password";
                btn.textContent = pw.type === "password" ? "👁" : "🙈";
                console.log("toggled to:", pw.type);
              });
          </script>
        <div class="down">
          <div class="btnWrap">
            <button class="btn1" type="submit">sign up</button>
          </div>

          <p class="error" id="msg" aria-live="polite"></p>

          <div class="link">
            <a href="../login/login.html" class="links">Already have an account? sign in</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

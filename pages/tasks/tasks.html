<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5fa">
  <title>My tasks · UniFlow</title>
  <link rel="stylesheet" href="../shared/layout.css">
  <link rel="stylesheet" href="tasks.css">
  <script type="module" src="tasks.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="../dashboard/index.html" aria-label="UniFlow home">
        <div class="logo"><img src="../assets/logo.png" alt=""></div>
        <div><h1>UniFlow</h1><p>Learn. Progress. Succeed.</p></div>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="../dashboard/index.html">Home</a>
        <a href="../courses/courses.html">My Courses</a>
        <a class="active" href="tasks.html">Tasks</a>
        <a class="admin" id="adminLink" href="../admin/admin.html">Admin</a>
        <a id="logoutBtn" href="../login/login.html">Log out</a>
      </nav>
      <footer>© 2026 UniFlow</footer>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menuBtn" id="menuBtn" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
        <label class="search" for="taskSearch"><input id="taskSearch" type="search" placeholder="Search tasks…" autocomplete="off"></label>
        <div class="user">
          <div class="avatar" id="avatar">S</div>
          <div><div class="name" id="username">Student</div><div class="meta" id="major">Major not set</div></div>
        </div>
      </header>

      <section class="content">
        <p class="page-error" id="pageError" role="alert" hidden></p>
        <section class="card">
          <div class="row">
            <div><h2>Choose your tasks</h2><p class="muted">Select tasks to add them to your personal checklist. You can clear the selection at any time.</p></div>
            <button class="btn primary" id="saveBtn" type="button">Save selection</button>
          </div>
          <div class="list" id="tasksList" aria-live="polite"></div>
          <p class="muted out" id="out" role="status"></p>
        </section>

        <section class="card">
          <div class="row"><div><h2>My checklist</h2><p class="muted">Tick a task when you finish it.</p></div><span class="badge" id="taskCount">0 / 0 complete</span></div>
          <div class="list" id="mineList" aria-live="polite"></div>
          <p class="muted out" id="mineOut" role="status"></p>
        </section>
      </section>
    </main>
  </div>
  <div class="overlay" id="overlay" hidden></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <link rel="stylesheet" href="../shared/layout.css">
  <link rel="stylesheet" href="login.css">
  <script defer type="module" src="login.js"></script>
</head>

<body>
  <div class="wrap">
    <div class="buttonWrap">
      <button class="button"><a href="../dashboard/index.html" class="bck">&lt; Back</a></button>
    </div>

    <div class="cardAuth">
      <div class="top">
        <p>Please enter your details</p>
        <h1>welcome back!</h1>
      </div>

      <form id="loginForm">
        <div class="mid">
          <div class="input">
            <label for="email" class="l1">Email</label>
            <input id="email" type="email" class="email" placeholder="you@example.com" required>
          </div>

          <div class="input">
            <label for="password" class="l1">Password</label>
            <input id="password" type="password" class="password" placeholder="password" minlength="6" required>
          </div>

          <div class="mid2">
            <div class="check">
              <input type="checkbox" class="check1" id="remember">
              <label for="remember">Remember later</label>
            </div>
            <a href="#" class="links" id="forgotLink">forgot password</a>
          </div>
        </div>

        <div class="down">
          <div class="btnWrap">
            <button class="but" type="submit">sign in</button>
          </div>

          <p class="error" id="msg" aria-live="polite"></p>

          <div class="link">
            <a href="../register/register.html" class="links">Don't have an account? sign up</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

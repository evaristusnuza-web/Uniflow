<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>Sign in · UniFlow</title>
  <link rel="stylesheet" href="../shared/layout.css">
  <link rel="stylesheet" href="login.css">
  <script type="module" src="login.js"></script>
</head>
<body class="auth-page">
  <main class="wrap">
    <a class="button back-link" href="../dashboard/index.html">← Back to UniFlow</a>
    <section class="cardAuth" aria-labelledby="page-title">
      <div class="top">
        <span class="eyebrow">YOUR LEARNING WORKSPACE</span>
        <h1 id="page-title">Welcome back</h1>
        <p>Sign in to continue learning and tracking your progress.</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="mid">
          <div class="input">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" class="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="input">
            <label for="pw">Password</label>
            <div class="password-field">
              <input id="pw" name="password" type="password" class="password" placeholder="Your password" autocomplete="current-password" required>
              <button id="pwToggle" type="button" class="toggle-pass" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
          </div>
          <div class="mid2">
            <label class="check" for="remember"><input type="checkbox" id="remember" checked> Keep me signed in</label>
            <button class="text-button" type="button" id="forgotLink">Forgot password?</button>
          </div>
        </div>
        <div class="down">
          <button class="but" type="submit">Sign in</button>
          <p class="error" id="msg" aria-live="polite" role="status"></p>
          <p class="auth-switch">New to UniFlow? <a href="../register/register.html">Create an account</a></p>
        </div>
      </form>
    </section>
  </main>
</body>
</html>

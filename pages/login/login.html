<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <link rel="stylesheet" href="../shared/layout.css">
  <link rel="stylesheet" href="login.css">
  <script defer type="module" src="login.js"></script>
</head>

<body>
  <div class="wrap">
    <div class="buttonWrap">
      <button class="button">
        <a href="../dashboard/index.html" class="bck">&lt; Back</a>
      </button>
    </div>

    <div class="cardAuth">
      <div class="top">
        <p>Please enter your details</p>
        <h1>welcome back!</h1>
      </div>

      <form id="loginForm">
        <div class="mid">
          <div class="input">
            <label for="email" class="l1">Email</label>
            <input id="email" type="email" class="email" placeholder="you@example.com" required>
          </div>
          <div class="input">
            <label for="pw" class="l1">Password</label>

            <div class="password-field">
              <input id="pw" type="password" class="password" placeholder="password" required />
              <button id="pwToggle" type="button" class="toggle-pass" aria-label="Show password">👁</button>
            </div>
          </div>
          <script>
            const pw = document.getElementById("pw");
            const btn = document.getElementById("pwToggle");

            btn.addEventListener("click"
              , () => {
                pw.type = pw.type === "password" ? "text" : "password";
                btn.textContent = pw.type === "password" ? "👁" : "🙈";
                console.log("toggled to:", pw.type);
              });
          </script>
          <div class="mid2">
            <div class="check">
              <input type="checkbox" class="check1" id="remember">
              <label for="remember">Remember later</label>
            </div>
            <a href="#" class="links" id="forgotLink">Forgot password</a>
          </div>
        </div>

        <div class="down">
          <div class="btnWrap">
            <button class="but" type="submit">sign in</button>
          </div>

          <p class="error" id="msg" aria-live="polite"></p>

          <div class="link">
            <a href="../register/register.html" class="links">Don't have an account? sign up</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>

</html>
